<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#map{width:100vw;height:100vh}
#topbar{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;flex-direction:column;align-items:center;padding:8px;pointer-events:none}
#topbar>*{pointer-events:auto}
#topbar-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:12px;padding:8px 14px;box-shadow:0 2px 12px rgba(0,0,0,.2);max-width:100%;flex-wrap:wrap;justify-content:center}
#topbar-row button{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}

#topbar-row button.danger:hover{background:#b91c1c}
#status{font-size:12px;color:#555;padding:4px 10px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:20px;margin-top:6px;white-space:nowrap;max-width:95vw;overflow:hidden;text-overflow:ellipsis}
#status.loading{color:#d97706}
#status.error{color:#dc2626}

#controls{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:12px;padding:8px 14px;box-shadow:0 2px 12px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;justify-content:center;max-width:95vw}
#controls label{color:#555;white-space:nowrap}
#controls input[type=range]{width:100px;accent-color:#2563eb}
#controls select{padding:4px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px}
#controls .val{font-weight:600;min-width:45px;color:#1e293b}
#controls .spacer{width:1px;height:24px;background:#e2e8f0;margin:0 4px}
#infopanel{position:absolute;bottom:0;left:0;right:0;z-index:1000;background:#fff;border-radius:16px 16px 0 0;padding:0;box-shadow:0 -2px 20px rgba(0,0,0,.2);max-height:65vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}

#infopanel .drag-handle{width:100%;height:32px;display:flex;align-items:center;justify-content:center;cursor:grab}

#infopanel .header{padding:12px 16px;background:#1e293b;color:#fff;border-radius:16px 16px 0 0;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
#infopanel .header .close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:0 4px;line-height:1;opacity:.7}
#infopanel .header .close:hover{opacity:1}
#infopanel .body{padding:12px 16px;font-size:13px;line-height:1.7}
#infopanel .body .row{display:flex}

#infopanel .body .value{color:#1e293b;word-break:break-word}

#infopanel .body .harvest-list{list-style:none;padding:0;margin:4px 0 0}
#infopanel .body .harvest-list li{padding:2px 0 2px 18px;position:relative;font-size:13px}
#infopanel .body .harvest-list li::before{content:'•';position:absolute;left:4px;color:#94a3b8}
#infopanel .body .harvest-section-title{font-weight:700;font-size:14px;margin-bottom:4px}
#parcel-count{position:absolute;bottom:20px;right:10px;z-index:1000;background:#1e293b;color:#fff;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;box-shadow:0 2px 12px rgba(0,0,0,.2)}
#tab-bar{display:none;width:100%;border-bottom:2px solid #e2e8f0;background:#f8fafc}
#tab-bar.visible{display:flex}
#tab-bar button{flex:1;padding:8px 0;background:none;border:none;border-bottom:3px solid transparent;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;transition:all .2s}
#tab-bar button.active{color:#1e293b;border-bottom-color:#2563eb}
#tab-bar button:hover{background:#f1f5f9}
#tab-content{display:none}
#tab-content.active{display:block}
#cache-toggle{position:absolute;top:140px;left:10px;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:10px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.2);transition:transform .2s ease,box-shadow .2s ease;user-select:none}
#cache-toggle:hover{transform:scale(1.1);box-shadow:0 3px 16px rgba(0,0,0,.25)}
#cache-toggle.active{background:#2563eb;color:#fff}
#cache-panel{position:absolute;top:140px;left:60px;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:12px;padding:0;box-shadow:0 2px 12px rgba(0,0,0,.2);width:260px;font-size:13px;max-height:60vh;overflow-y:auto;transition:opacity .2s ease,transform .2s ease;opacity:1;transform:translateX(0)}
#cache-panel.hidden{opacity:0;transform:translateX(-20px);pointer-events:none}
#cache-panel h3{font-size:14px;margin:0;padding:12px 14px 8px;color:#1e293b;border-bottom:1px solid #e2e8f0}
#cache-panel .item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #e2e8f0;font-size:12px}
#cache-panel .item:last-child{border-bottom:none}
#cache-panel .item-name{flex:1;font-weight:500;color:#334155}
#cache-panel .item-size{color:#64748b;font-size:11px}
#cache-panel .btn-sm{background:#64748b;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}
#cache-panel .btn-sm:hover{background:#475569}
#cache-progress{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2000;background:rgba(255,255,255,.97);border-radius:16px;padding:24px 32px;box-shadow:0 4px 24px rgba(0,0,0,.3);text-align:center;min-width:280px}
#cache-progress .title{font-size:16px;font-weight:700;color:#1e293b;margin-bottom:12px}
#cache-progress .bar-bg{background:#e2e8f0;border-radius:8px;height:8px;overflow:hidden;margin:8px 0}
#cache-progress .bar{background:#2563eb;height:100%;border-radius:8px;width:0%;transition:width .3s}
#cache-progress .detail{font-size:12px;color:#64748b;margin-top:4px}
#offline-banner{display:none;position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:1000;background:#f59e0b;color:#000;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.leaflet-popup-content-wrapper{border-radius:8px;font-size:13px}
.leaflet-popup-content{margin:8px 12px}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div id="topbar-row">
    <button id="btnLocate" title="Use my current location">📍 My Location</button>
    <button id="btnRecenter" class="secondary" title="Re-center map to your location" disabled>🔄 Re-center</button>
    <button id="btnCache" class="secondary" title="Cache tiles and parcels for current area" disabled>💾 Cache Area</button>
    <button id="btnDistricts" class="secondary" title="Show hunting district boundaries">🦌 Districts</button>
    <button id="btnClearCache" class="danger" title="Remove cached data">🗑️ Clear Cache</button>
  </div>
  <div id="status">Tap "My Location" or click the map to find nearby properties. Enable 🦌 Districts to see hunting boundaries.</div>
</div>

<div id="offline-banner">📡 Offline Mode — using cached data</div>

<div id="controls">
  <span id="radiusDisplay">Radius: 200 m</span>
</div>

<div id="cache-toggle" title="Cached areas" style="display:none">💾</div>

<div id="cache-panel" class="hidden">
  <h3>💾 Cached Areas</h3>
  <div id="cacheList" style="padding:8px 14px"><em style="color:#94a3b8;font-size:12px">No cached areas</em></div>
</div>

<div id="parcel-count"><span id="countText">0 parcels</span></div>

<div id="infopanel">
  <div class="drag-handle"></div>
  <div id="tab-bar"></div>
  <div class="header">
    <span id="panelTitle">Property Details</span>
    <button class="close" onclick="closePanel()">&times;</button>
  </div>
  <div class="body" id="panelBody"></div>
</div>

<div id="cache-progress">
  <div class="title" id="cacheTitle">Caching area...</div>
  <div class="bar-bg"><div class="bar" id="cacheBar"></div></div>
  <div class="detail" id="cacheDetail"></div>
</div>

<script>
// ═══════════════════════════════════════════
// IndexedDB Helper
// ═══════════════════════════════════════════
const DB_NAME = 'mt-cadastral-db';
const DB_VERSION = 2;

function dbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('tiles'))
        db.createObjectStore('tiles', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('parcels')) {
        const os = db.createObjectStore('parcels', { keyPath: 'key' });
        os.createIndex('bbox', ['bbox'], { unique: false });
      }
      if (!db.objectStoreNames.contains('manifest'))
        db.createObjectStore('manifest', { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGet(store, key) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

function dbPut(store, key, value) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put({ key, value });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function dbDelete(store, key) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function dbClear(store) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function dbCount(store) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).count();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}

function dbGetAll(store) {
  return dbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result.map(r => r.value));
    req.onerror = () => reject(req.error);
  }));
}

// ═══════════════════════════════════════════
// Map Setup — base layers + tile caching
// ═══════════════════════════════════════════
const map = L.map('map', {
  zoomControl: false,
  minZoom: 3,
  maxZoom: 19
}).setView([46.8721, -110.3626], 7);

L.control.zoom({ position: 'topright' }).addTo(map);

// Base layers
const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
});

const esriImagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: '&copy; Esri, Maxar, Earthstar Geographics, USDA, USGS, AeroGRID, IGN, and the GIS User Community'
});

const esriTopo = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: '&copy; Esri, HERE, Garmin, USGS, and the GIS User Community'
});

const baseLayers = {
  'Streets': osmLayer,
  'Satellite': esriImagery,
  'Topo': esriTopo
};

osmLayer.addTo(map);

// Layer switcher top-right (above zoom)
const layerControl = L.control.layers(baseLayers).addTo(map);
layerControl._container.style.marginTop = '10px';

// ═══════════════════════════════════════════
// State
// ═══════════════════════════════════════════
let gpsMarker = null;       // persistent GPS location marker
let queryMarker = null;     // temporary marker for map click / query location
let parcelLayer = null;
let cacheCircle = null;
let gpsLat = null;          // persistent GPS coordinates
let gpsLng = null;
let queryLat = null;        // query location (from map click)
let queryLng = null;
let cachedAreaKey = null;

const API = 'https://gisservice.mt.gov/ArcGIS/rest/services/msdi_cadastral_map_v1/MapServer/1/query';
const DISTRICT_API = 'https://services3.arcgis.com/Cdxz8r11hT0MGzg1/arcgis/rest/services/ADMBND_HD_DEERELKLION/FeatureServer/0/query';

// Region colors for hunting districts
const REGION_COLORS = {
  1: '#e74c3c',  // Region 1 - Red
  2: '#e67e22',  // Region 2 - Orange
  3: '#f1c40f',  // Region 3 - Yellow
  4: '#2ecc71',  // Region 4 - Green
  5: '#3498db',  // Region 5 - Blue
  6: '#9b59b6',  // Region 6 - Purple
  7: '#1abc9c',  // Region 7 - Teal
};

let districtLayer = null;
let districtsEnabled = false;
let highlightedDistrict = null;  // currently highlighted district GeoJSON layer
let regulationsData = null;      // cached harvest regulations
let regulationsLoaded = false;   // whether regulations file has been fetched
let _parcelTabDistrict = null;   // district data for tabbed parcel panel

// ═══════════════════════════════════════════
// Radius — auto-set by zoom level, max 2000m
// ═══════════════════════════════════════════
const radiusDisplay = document.getElementById('radiusDisplay');

function zoomToRadius(zoom) {
  return Math.round(176000 * Math.pow(0.6, zoom - 3));
}

function getDistanceMeters() {
  const auto = zoomToRadius(map.getZoom());
  return Math.min(auto, 2000);
}

map.on('zoomend', () => {
  const r = getDistanceMeters();
  radiusDisplay.textContent = `Radius: ${r} m`;
  if (queryLat != null) updateCacheCircle();
});

function getRadiusParams() {
  const val = getDistanceMeters();
  const unit = 'esriSRUnit_Meter';
  return { distance: val, units: unit };
}

// ═══════════════════════════════════════════
// Status helper
// ═══════════════════════════════════════════
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

// ═══════════════════════════════════════════
// Utility
// ═══════════════════════════════════════════
function fmt(n) {
  if (n == null || n === '') return '<span class="muted">N/A</span>';
  return '$' + Number(n).toLocaleString();
}

function closePanel() {
  document.getElementById('infopanel').classList.remove('open');
  clearTabs();
}

function openPanel(title, html) {
  clearTabs();
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelBody').innerHTML = html;
  document.getElementById('infopanel').classList.add('open');
}

function clearTabs() {
  document.getElementById('tab-bar').innerHTML = '';
  document.getElementById('tab-bar').className = '';
  _parcelTabDistrict = null;
}

// ═══════════════════════════════════════════
// Geometric helpers
// ═══════════════════════════════════════════
function metersToDelta(lat, meters) {
  const R = 6378137;
  const dLat = meters / R;
  const dLng = meters / (R * Math.cos(lat * Math.PI / 180));
  return { dLat, dLng };
}

function bboxFromCenter(lat, lng, radius) {
  const { dLat, dLng } = metersToDelta(lat, radius);
  return {
    west: lng - dLng,
    east: lng + dLng,
    south: lat - dLat,
    north: lat + dLat
  };
}

function tileRangeFromBbox(west, south, east, north, zoom) {
  const n = Math.pow(2, zoom);
  const toX = (lon) => Math.floor(((lon + 180) / 360) * n);
  const toY = (lat) => {
    const latRad = lat * Math.PI / 180;
    return Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
  };
  return {
    xMin: Math.max(0, toX(west)),
    xMax: Math.min(n - 1, toX(east)),
    yMin: Math.max(0, toY(north)),
    yMax: Math.min(n - 1, toY(south))
  };
}

function getAreaKey(lat, lng, radius) {
  return `a${lat.toFixed(3)}l${lng.toFixed(3)}r${Math.round(radius)}`;
}

// ═══════════════════════════════════════════
// Update cache circle on map
// ═══════════════════════════════════════════
function updateCacheCircle() {
  if (queryLat == null) return;
  const r = getDistanceMeters();
  if (cacheCircle) map.removeLayer(cacheCircle);
  cacheCircle = L.circle([queryLat, queryLng], {
    radius: r, color: '#8b5cf6', fillColor: '#8b5cf6',
    fillOpacity: 0.1, weight: 2, dashArray: '6,6'
  }).addTo(map);
}

// ═══════════════════════════════════════════
// Fetch parcels (online)
// ═══════════════════════════════════════════
async function fetchParcelsOnline(lat, lng) {
  const { distance, units } = getRadiusParams();
  const params = new URLSearchParams({
    where: '1=1',
    outFields: 'PARCELID,OwnerName,CountyName,TaxYear,TotalValue,TotalLandValue,TotalBuildingValue,TotalAcres,AddressLine1,AddressLine2,CityStateZip,PropType,OwnerAddress1,OwnerAddress2,OwnerCity,OwnerState,OwnerZipCode,AssessmentCode,Township,Range,Section,LegalDescriptionShort,Subdivision',
    geometry: `${lng},${lat}`,
    geometryType: 'esriGeometryPoint',
    inSR: '4326',
    outSR: '4326',
    distance: distance,
    units: units,
    relationOp: 'esriSpatialRelIntersects',
    f: 'json',
    returnGeometry: 'true',
    resultRecordCount: 5000,
  });

  const resp = await fetch(`${API}?${params}`);
  const data = await resp.json();
  return data.features || [];
}

// ═══════════════════════════════════════════
// Fetch parcels (online, by bounding box)
// ═══════════════════════════════════════════
async function fetchParcelsByBbox(west, south, east, north) {
  const params = new URLSearchParams({
    where: '1=1',
    outFields: 'PARCELID,OwnerName,CountyName,TaxYear,TotalValue,TotalLandValue,TotalBuildingValue,TotalAcres,AddressLine1,AddressLine2,CityStateZip,PropType,OwnerAddress1,OwnerAddress2,OwnerCity,OwnerState,OwnerZipCode,AssessmentCode,Township,Range,Section,LegalDescriptionShort,Subdivision',
    geometry: `${west},${south},${east},${north}`,
    geometryType: 'esriGeometryEnvelope',
    inSR: '4326',
    outSR: '4326',
    relationOp: 'esriSpatialRelIntersects',
    f: 'json',
    returnGeometry: 'true',
    resultRecordCount: 5000,
  });

  const resp = await fetch(`${API}?${params}`);
  const data = await resp.json();
  return data.features || [];
}

// ═══════════════════════════════════════════
// Convert ArcGIS geometry to GeoJSON
// ═══════════════════════════════════════════
function toGeoJSONGeom(geom) {
  if (!geom) return null;
  if (geom.type) return geom;
  if (geom.rings) return { type: 'Polygon', coordinates: geom.rings };
  if (geom.polygons) return { type: 'MultiPolygon', coordinates: geom.polygons.map(p => p.rings || [p.rings]) };
  if (geom.points) return { type: 'Point', coordinates: geom.points };
  return geom;
}

// ═══════════════════════════════════════════
// Render parcels on map
// ═══════════════════════════════════════════
function renderParcels(features) {
  if (parcelLayer) map.removeLayer(parcelLayer);
  if (!features.length) {
    document.getElementById('countText').textContent = '0 parcels';
    return;
  }

  const geojsonFeatures = features.map(f => ({
    type: 'Feature',
    geometry: toGeoJSONGeom(f.geometry),
    properties: f.attributes
  }));

  parcelLayer = L.geoJSON(geojsonFeatures, {
    style: () => ({
      color: '#3b82f6', weight: 1.5, opacity: 0.8,
      fillColor: '#93c5fd', fillOpacity: 0.25,
    }),
    onEachFeature: (feature, layer) => {
      const a = feature.properties;
      const owner = a.OwnerName || 'Unknown Owner';
      const address = [a.AddressLine1, a.AddressLine2, a.CityStateZip].filter(Boolean).join(', ');
      const parcelKey = a.PARCELID || `parcel_${Math.random().toString(36).substr(2, 9)}`;

      // Click on map layer opens the parcel popup (flyout only)
      layer.on('click', (e) => {
        L.DomEvent.stop(e);
        layer.openPopup();
      });

      // Attach parcel data to layer for popup
      layer._parcelData = { a, owner, address, parcelKey };

      // Bind popup — use function callback so content is created at open time
      layer.bindPopup((l) => {
        const pd = layer._parcelData;
        const valueHtml = pd.a.TotalValue != null ? `Value: ${fmt(pd.a.TotalValue)}` : '';
        const html = `<strong>${pd.owner}</strong><br><em>${pd.address || 'No street address'}</em>${valueHtml ? `<br><span style="color:#64748b">${valueHtml}</span>` : ''}<br><button class="parcel-more-btn" data-parcel-key="${pd.parcelKey}" style="margin-top:6px;padding:4px 12px;background:#2563eb;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;width:100%">More</button>`;

        // Immediately wire the More button (popup content just created)
        const wrapper = document.createElement('div');
        wrapper.innerHTML = html;
        const btn = wrapper.querySelector('.parcel-more-btn');
        if (btn) {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const pd = layer._parcelData;
            if (districtsEnabled) {
              // Query district at parcel centroid
              const centroid = getFeatureCentroid(feature);
              if (centroid) {
                try {
                  const params = new URLSearchParams({
                    where: '1=1',
                    outFields: 'REG,DISTRICT,NAME,EMU_NAME,HARVTYPE,AREA_AC,AREA_KM,AREA_MI,MAPLINK,DEERWEBPAGE,ELKWEBPAGE',
                    geometry: `${centroid.lng},${centroid.lat}`,
                    geometryType: 'esriGeometryPoint',
                    inSR: '4326',
                    outSR: '4326',
                    relationOp: 'esriSpatialRelIntersects',
                    f: 'json',
                    returnGeometry: 'true',
                    resultRecordCount: 1,
                  });
                  const resp = await fetch(`${DISTRICT_API}?${params}`);
                  const data = await resp.json();
                  const feats = data.features || [];
                  if (feats.length > 0) {
                    const a = feats[0].attributes;
                    showParcelDistrictPanel(pd.a, pd.owner, a);
                    return;
                  }
                } catch (err) {
                  console.warn('District query for parcel failed:', err);
                }
              }
              // Fallback to regular panel if district query fails
              showParcelPanel(pd.a, pd.owner);
            } else {
              showParcelPanel(pd.a, pd.owner);
            }
          });
        }
        return wrapper;
      }, { maxWidth: 280 });
    }
  }).addTo(map);

  document.getElementById('countText').textContent = `${features.length} parcels`;
}

function switchTab(tabName) {
  const bar = document.getElementById('tab-bar');
  const btns = bar.querySelectorAll('button');
  btns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
  const titleEl = document.getElementById('panelTitle');
  if (tabName === 'district' && _parcelTabDistrict) {
    titleEl.textContent = `${_parcelTabDistrict.NAME || 'Hunting District'}`;
  } else {
    const owner = titleEl.dataset.owner || '';
    titleEl.textContent = owner || 'Property Details';
  }

  // Toggle property vs district content by CSS class
  const body = document.getElementById('panelBody');
  if (tabName === 'district') {
    body.classList.add('district-tab');
    body.classList.remove('property-tab');
    // Show district sections (override inline display:none)
    body.querySelectorAll('.district-section').forEach(s => s.classList.add('visible'));
  } else {
    body.classList.add('property-tab');
    body.classList.remove('district-tab');

    body.querySelectorAll('.district-section').forEach(s => s.classList.remove('visible'));

async function fetchDistricts() {
  const params = new URLSearchParams({
    where: '1=1',
    outFields: 'REG,DISTRICT,NAME,EMU_NAME,HARVTYPE,AREA_AC,AREA_KM,AREA_MI,MAPLINK,DEERWEBPAGE,ELKWEBPAGE',
    f: 'json',
    returnGeometry: 'true',
    resultRecordCount: 200,
  });

  const resp = await fetch(`${DISTRICT_API}?${params}`);
  const data = await resp.json();
  return data.features || [];
}

function districtColor(reg) {
  return REGION_COLORS[reg] || '#888888';
}

function districtStyle(feature) {
  const reg = feature.properties.REG;
  const color = districtColor(reg);
  return {
    color: color,
    weight: 1.5,
    opacity: 0.8,
    fillColor: color,
    fillOpacity: 0.15,
  };
}

function highlightStyle(feature) {
  const reg = feature.properties.REG;
  const color = districtColor(reg);
  return {
    color: color,
    weight: 3,
    opacity: 1,
    fillColor: color,
    fillOpacity: 0.4,
  };
}

function formatArea(acres) {
  if (acres == null) return 'N/A';
  const a = Number(acres);
  if (a >= 1000000) return (a / 1000000).toFixed(2) + 'M ac';
  if (a >= 1000) return (a / 1000).toFixed(1) + 'K ac';
  return a.toFixed(0) + ' ac';
}

function getFeatureCentroid(feature) {
  // Get center of feature bounds (from GeoJSON geometry)
  if (!feature || !feature.geometry) return null;
  const geom = feature.geometry;
  let coords = [];
  if (geom.type === 'Polygon') {
    coords = geom.coordinates[0];
  } else if (geom.type === 'MultiPolygon') {
    coords = geom.coordinates[0][0];
  } else if (geom.rings) {
    coords = geom.rings[0];
  } else if (geom.type === 'Point') {
    return geom.coordinates;
  }
  if (!coords.length) return null;
  let latSum = 0, lngSum = 0;
  for (const c of coords) { lngSum += c[0]; latSum += c[1]; }
  return { lat: latSum / coords.length, lng: lngSum / coords.length };
}

// Load regulations JSON (cached after first fetch)
async function loadRegulations() {
  if (regulationsLoaded) return regulationsData;
  try {
    const resp = await fetch('montana_general_tag_regulations.json');
    if (resp.ok) {
      regulationsData = await resp.json();
      regulationsLoaded = true;
      return regulationsData;
    }
  } catch (e) {
    console.warn('Failed to load regulations:', e);
  }
  return {};
}

function buildHarvestHtml(a) {
  const distKey = String(a.DISTRICT || '');
  if (!distKey) return '';

  // Try to get harvest info (will load regulations if needed)
  return loadRegulations().then(data => {
    const reg = data[distKey];
    if (!reg || (!reg.deer && !reg.elk)) return '';

    let html = '<div class="section"><div style="font-weight:700;font-size:14px;margin-bottom:6px">Harvestable Game</div>';

    if (reg.deer && reg.deer.length) {
      html += `<div class="harvest-section-title">🦌 Deer</div>`;
      html += '<ul class="harvest-list">';
      reg.deer.forEach(d => { html += `<li>${d}</li>`; });
      html += '</ul>';
    }

    if (reg.elk && reg.elk.length) {
      html += `<div class="harvest-section-title">🦌 Elk</div>`;
      html += '<ul class="harvest-list">';
      reg.elk.forEach(e => { html += `<li>${e}</li>`; });
      html += '</ul>';
    }

    html += '</div>';
    return html;
  }).catch(() => '');
}

function toggleDistricts() {
  if (districtsEnabled) {
    // Turn off
    if (districtLayer) {
      map.removeLayer(districtLayer);
      districtLayer = null;
    }
    if (highlightedDistrict) {
      map.removeLayer(highlightedDistrict);
      highlightedDistrict = null;
    }
    districtsEnabled = false;
    document.getElementById('btnDistricts').classList.add('secondary');
    document.getElementById('btnDistricts').style.background = '';
    setStatus('Hunting districts hidden', '');
    // Keep parcels above any remaining highlights
    if (parcelLayer) parcelLayer.bringToFront();
    return;
  }

  setStatus('Loading hunting districts...', 'loading');
  document.getElementById('btnDistricts').disabled = true;

  fetchDistricts().then(features => {
    const geojson = features.map(f => ({
      type: 'Feature',
      geometry: toGeoJSONGeom(f.geometry),
      properties: f.attributes
    }));

    if (districtLayer) map.removeLayer(districtLayer);

    districtLayer = L.geoJSON(geojson, {
      style: districtStyle,
      interactive: false,  // Base layer: visual only, doesn't capture clicks
      onEachFeature: (feature, layer) => {
        layer.on('mouseover', (e) => {
          if (!highlightedDistrict) {
            e.target.setStyle({ fillOpacity: 0.3 });
          }
        });
        layer.on('mouseout', (e) => {
          if (!highlightedDistrict) {
            districtLayer.resetStyle(e.target);
          }
        });
      }
    }).addTo(map);

    // Interactive overlay for click (on top of base layer, but parcels still above it via bringToFront)
    const districtOverlay = L.geoJSON(geojson, {
      style: { fillOpacity: 0, opacity: 0 },
      interactive: true,
      onEachFeature: (feature, layer) => {
        layer.on('click', (e) => {
          L.DomEvent.stop(e);
          if (highlightedDistrict) map.removeLayer(highlightedDistrict);
          highlightedDistrict = L.geoJSON(feature, {
            style: highlightStyle(feature)
          }).addTo(map);
          showDistrictPanel(feature.properties, feature);
        });
      }
    }).addTo(map);
    window._districtOverlay = districtOverlay;

    districtsEnabled = true;
    document.getElementById('btnDistricts').style.background = '#d97706';
    setStatus(`Loaded ${features.length} hunting districts`, '');
    document.getElementById('btnDistricts').disabled = false;

    // Put parcels above districts so they remain clickable
    if (parcelLayer) parcelLayer.bringToFront();

    // Highlight district at current query location if active
    if (queryLat != null) {
      highlightDistrictAt(queryLat, queryLng);
    }
  }).catch(e => {
    setStatus(`Failed to load districts: ${e.message}`, 'error');
    document.getElementById('btnDistricts').disabled = false;
  });
}

function highlightDistrictAt(lat, lng, showPanel = true) {
  if (!districtsEnabled || !districtLayer || lat == null) return;
  if (highlightedDistrict) {
    map.removeLayer(highlightedDistrict);
    highlightedDistrict = null;
  }

  const params = new URLSearchParams({
    where: '1=1',
    outFields: 'REG,DISTRICT,NAME,EMU_NAME,HARVTYPE,AREA_AC,AREA_KM,AREA_MI,MAPLINK,DEERWEBPAGE,ELKWEBPAGE',
    geometry: `${lng},${lat}`,
    geometryType: 'esriGeometryPoint',
    inSR: '4326',
    outSR: '4326',
    relationOp: 'esriSpatialRelIntersects',
    f: 'json',
    returnGeometry: 'true',
    resultRecordCount: 1,
  });

  fetch(`${DISTRICT_API}?${params}`)
    .then(r => r.json())
    .then(data => {
      const features = data.features || [];
      if (features.length === 0) {
        setStatus('Not inside any hunting district', '');
        return;
      }
      const f = features[0];
      const a = f.attributes;
      // Convert ArcGIS feature to GeoJSON format (attributes -> properties)
      const geoFeature = {
        type: 'Feature',
        geometry: toGeoJSONGeom(f.geometry),
        properties: a
      };
      highlightedDistrict = L.geoJSON(geoFeature, {
        style: highlightStyle(geoFeature)
      }).addTo(map);
      if (showPanel) {
        showDistrictPanel(a, f);
      }
      setStatus(`Hunting District ${a.DISTRICT || '—'}: ${a.NAME}`, '');
    })
    .catch(e => {
      console.warn('District query failed:', e);
    });
}

// ═══════════════════════════════════════════
async function loadParcelsForLocation() {
  if (queryLat == null) return;

  // Check offline mode
  const isOffline = !navigator.onLine;
  document.getElementById('offline-banner').style.display = isOffline ? 'block' : 'none';

  // Try online first (if available)
  try {
    const features = await fetchParcelsOnline(queryLat, queryLng);
    renderParcels(features);
    setStatus(`Found ${features.length} parcels nearby`, '');
    return;
  } catch (e) {
    // Online failed, try offline
  }

  // Offline: check cached data
  if (cachedAreaKey) {
    try {
      const cached = await dbGet('parcels', cachedAreaKey);
      if (cached && cached.features) {
        renderParcels(cached.features);
        setStatus(`${cached.features.length} parcels from cache`, 'offline');
        return;
      }
    } catch (e) {}
  }

  setStatus('No data available — cache an area first', 'error');
}

// ═══════════════════════════════════════════
// Locate user
// ═══════════════════════════════════════════
function locateUser() {
  setStatus('Locating...', 'loading');
  document.getElementById('btnLocate').disabled = true;
  document.getElementById('btnRecenter').disabled = true;

  if (!navigator.geolocation) {
    setStatus('Geolocation not supported by this browser', 'error');
    document.getElementById('btnLocate').disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      gpsLat = pos.coords.latitude;
      gpsLng = pos.coords.longitude;
      queryLat = gpsLat;
      queryLng = gpsLng;
      cachedAreaKey = null;
      placeGpsMarker();
    },
    (err) => {
      let msg = 'Could not get your location.';
      if (err.code === 1) msg = 'Location permission denied. Enable location access in your browser settings.';
      else if (err.code === 2) msg = 'Position unavailable. Try clicking the map manually.';
      else if (err.code === 3) msg = 'Location request timed out. Try again or click the map.';
      setStatus(msg, 'error');
      document.getElementById('btnLocate').disabled = false;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function placeGpsMarker() {
  if (gpsMarker) map.removeLayer(gpsMarker);
  gpsMarker = L.circleMarker([gpsLat, gpsLng], {
    radius: 10, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 0.5, weight: 2
  }).addTo(map);
  gpsMarker.bindTooltip('You are here', { direction: 'top', offset: [0, -10] });

  // Also set query location and show click marker
  queryLat = gpsLat;
  queryLng = gpsLng;
  placeQueryMarker();
  updateCacheCircle();

  // Center map on GPS location
  map.setView([gpsLat, gpsLng], 13);

  // Load parcels at GPS location
  loadParcelsForLocation();

  // Highlight district if layers are active
  highlightDistrictAt(queryLat, queryLng);

  document.getElementById('btnLocate').disabled = false;
  document.getElementById('btnRecenter').disabled = false;
  document.getElementById('btnCache').disabled = false;
}

function placeQueryMarker() {
  if (queryMarker) map.removeLayer(queryMarker);
  queryMarker = L.circleMarker([queryLat, queryLng], {
    radius: 6, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.7, weight: 2
  }).addTo(map);
}

// ═══════════════════════════════════════════
// Cache an area (tiles + parcels)
// ═══════════════════════════════════════════
async function cacheArea() {
  if (queryLat == null) return;

  const radius = 2000; // always cache 2000m for full coverage

  const progress = document.getElementById('cache-progress');
  const title = document.getElementById('cacheTitle');
  const bar = document.getElementById('cacheBar');
  const detail = document.getElementById('cacheDetail');

  progress.style.display = 'block';
  title.textContent = 'Caching area...';
  bar.style.width = '0%';

  try {
    // Step 1: Cache tiles
    const bbox = bboxFromCenter(queryLat, queryLng, radius);
    const zooms = [14, 15, 16];
    let totalTiles = 0;
    for (const z of zooms) {
      const tr = tileRangeFromBbox(bbox.west, bbox.south, bbox.east, bbox.north, z);
      totalTiles += (tr.xMax - tr.xMin + 1) * (tr.yMax - tr.yMin + 1);
    }
    let tilesSoFar = 0;

    title.textContent = `Downloading ${totalTiles} tiles...`;
    detail.textContent = 'Fetching map tiles';

    for (const z of zooms) {
      const tr = tileRangeFromBbox(bbox.west, bbox.south, bbox.east, bbox.north, z);
      for (let x = tr.xMin; x <= tr.xMax; x++) {
        for (let y = tr.yMin; y <= tr.yMax; y++) {
          const key = `${z}/${x}/${y}`;
          const existing = await dbGet('tiles', key);
          if (!existing) {
            try {
              const url = `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
              const resp = await fetch(url);
              if (resp.ok) {
                const blob = await resp.blob();
                await dbPut('tiles', key, blob);
              }
            } catch (e) {
              // Skip failed tiles
            }
          }
          tilesSoFar++;
          const pct = Math.round((tilesSoFar / totalTiles) * 70);
          bar.style.width = pct + '%';
          detail.textContent = `${tilesSoFar}/${totalTiles} tiles cached (${z})`;
          // Yield to keep UI responsive
          if (tilesSoFar % 20 === 0) await new Promise(r => setTimeout(r, 0));
        }
      }
    }

    // Step 2: Cache parcel data — use point+distance query (reliable)
    title.textContent = 'Downloading parcel data...';
    bar.style.width = '75%';
    detail.textContent = 'Querying property records';

    const params = new URLSearchParams({
      where: '1=1',
      outFields: 'PARCELID,OwnerName,CountyName,TaxYear,TotalValue,TotalLandValue,TotalBuildingValue,TotalAcres,AddressLine1,AddressLine2,CityStateZip,PropType,OwnerAddress1,OwnerAddress2,OwnerCity,OwnerState,OwnerZipCode,AssessmentCode,Township,Range,Section,LegalDescriptionShort,Subdivision',
      geometry: `${queryLng},${queryLat}`,
      geometryType: 'esriGeometryPoint',
      inSR: '4326',
      outSR: '4326',
      distance: radius,
      units: 'esriSRUnit_Meter',
      relationOp: 'esriSpatialRelIntersects',
      f: 'json',
      returnGeometry: 'true',
      resultRecordCount: 5000,
    });

    const resp = await fetch(`${API}?${params}`);
    const data = await resp.json();
    const parcels = data.features || [];

    const areaKey = getAreaKey(queryLat, queryLng, radius);
    await dbPut('parcels', areaKey, {
      key: areaKey,
      lat: queryLat,
      lng: queryLng,
      radius: radius,
      bbox: [bbox.west, bbox.south, bbox.east, bbox.north],
      features: parcels,
      cachedAt: Date.now()
    });

    // Step 3: Update manifest
    await dbPut('manifest', areaKey, {
      key: areaKey,
      lat: queryLat,
      lng: queryLng,
      radius: radius,
      tileCount: totalTiles,
      parcelCount: parcels.length,
      cachedAt: Date.now()
    });

    bar.style.width = '100%';
    title.textContent = `Cached ${totalTiles} tiles + ${parcels.length} parcels`;
    detail.textContent = 'Area cached successfully ✓';

    // Reload with cached data
    renderParcels(parcels);
    setStatus(`Cached area: ${totalTiles} tiles, ${parcels.length} parcels`, '');
    await refreshCacheList();
    // Open panel to show what was cached
    document.getElementById('cache-panel').classList.remove('hidden');
    document.getElementById('cache-toggle').classList.add('active');

  } catch (e) {
    title.textContent = 'Cache failed';
    detail.textContent = e.message;
    setStatus(`Cache error: ${e.message}`, 'error');
  }

  setTimeout(() => { progress.style.display = 'none'; }, 3000);
}

// ═══════════════════════════════════════════
// Cache list management
// ═══════════════════════════════════════════
document.getElementById('cache-toggle').addEventListener('click', () => {
  document.getElementById('cache-panel').classList.toggle('hidden');
  document.getElementById('cache-toggle').classList.toggle('active');
});
async function refreshCacheList() {
  const listEl = document.getElementById('cacheList');
  let manifest;
  try { manifest = await dbGetAll('manifest'); } catch { manifest = []; }

  if (!manifest.length) {
    listEl.innerHTML = '<em style="color:#94a3b8;font-size:12px">No cached areas</em>';
    return;
  }

  listEl.innerHTML = manifest.map(m => {
    const date = new Date(m.cachedAt).toLocaleDateString();
    return `<div class="item">
      <span class="item-name">${m.lat.toFixed(2)}°, ${m.lng.toFixed(2)}°<br><span style="color:#94a3b8;font-size:10px">${m.parcelCount} parcels · ${date}</span></span>
      <button class="btn-sm" onclick="loadCachedArea('${m.key}')">Load</button>
      <button class="btn-sm" onclick="deleteArea('${m.key}')" style="margin-left:4px;background:#dc2626">✕</button>
    </div>`;
  }).join('');
}

async function loadCachedArea(key) {
  try {
    const data = await dbGet('parcels', key);
    if (data && data.features) {
      gpsLat = data.lat;
      gpsLng = data.lng;
      queryLat = data.lat;
      queryLng = data.lng;
      cachedAreaKey = key;
      placeGpsMarker();
      updateCacheCircle();
      radiusDisplay.textContent = `Radius: ${getDistanceMeters()} m`;
      document.getElementById('btnCache').disabled = false;
      renderParcels(data.features);
      setStatus(`Loaded cached area: ${data.features.length} parcels`, '');
    }
  } catch (e) {
    setStatus(`Error loading area: ${e.message}`, 'error');
  }
}

async function deleteArea(key) {
  await dbDelete('parcels', key);
  await dbDelete('manifest', key);
  if (cachedAreaKey === key) cachedAreaKey = null;
  await refreshCacheList();
  refreshCacheSize();
}

async function clearAllCache() {
  await dbClear('tiles');
  await dbClear('parcels');
  await dbClear('manifest');
  cachedAreaKey = null;
  await refreshCacheList();
  refreshCacheSize();
  setStatus('Cache cleared', '');
}

async function refreshCacheSize() {
  let tileCount, parcelCount;
  try {
    [tileCount, parcelCount] = await Promise.all([dbCount('tiles'), dbCount('parcels')]);
  } catch { return; }
  if (tileCount > 0 || parcelCount > 0) {
    document.getElementById('cache-toggle').style.display = 'flex';
    await refreshCacheList();
  } else {
    document.getElementById('cache-toggle').style.display = 'none';
  }
}

// ═══════════════════════════════════════════
// Drag-to-scroll panel (mobile)
// ═══════════════════════════════════════════
(function() {
  const panel = document.getElementById('infopanel');
  const handle = panel.querySelector('.drag-handle');
  let startY, startTranslateY = 0;
  let dragging = false;

  handle.addEventListener('touchstart', (e) => {
    if (!panel.classList.contains('open')) return;
    dragging = true;
    startY = e.touches[0].clientY;
    const rect = panel.getBoundingClientRect();
    startTranslateY = rect.bottom - window.innerHeight;
    panel.style.transition = 'none';
  });

  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const y = e.touches[0].clientY;
    const dy = startY - y;
    const newBottom = Math.max(0, startTranslateY + dy);
    panel.style.transform = `translateY(${window.innerHeight - newBottom}px)`;
  });

  document.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = 'transform .3s ease';
    const rect = panel.getBoundingClientRect();
    const visible = rect.height < window.innerHeight * 0.6;
    panel.classList.toggle('open', !visible);
    panel.style.transform = '';
  });
})();

// ═══════════════════════════════════════════
// Events
// ═══════════════════════════════════════════
document.getElementById('btnLocate').addEventListener('click', locateUser);
document.getElementById('btnCache').addEventListener('click', cacheArea);
document.getElementById('btnDistricts').addEventListener('click', toggleDistricts);
document.getElementById('btnClearCache').addEventListener('click', () => {
  if (confirm('Clear all cached tiles and parcel data?')) clearAllCache();
});

// Click map to set query location (GPS marker stays visible)
map.on('click', (e) => {
  queryLat = e.latlng.lat;
  queryLng = e.latlng.lng;
  cachedAreaKey = null;
  placeQueryMarker();
  updateCacheCircle();
  loadParcelsForLocation();
  highlightDistrictAt(queryLat, queryLng, false);  // highlight but don't open district panel
  document.getElementById('btnCache').disabled = false;
});

// Re-center button: go back to GPS location
document.getElementById('btnRecenter').addEventListener('click', () => {
  if (gpsLat == null) return;
  queryLat = gpsLat;
  queryLng = gpsLng;
  placeQueryMarker();
  updateCacheCircle();
  map.setView([gpsLat, gpsLng], 15);
  loadParcelsForLocation();
  highlightDistrictAt(queryLat, queryLng);
});

// Show cache panel
map.on('moveend', () => {
  refreshCacheSize();
});

// ═══════════════════════════════════════════
// Init
// ═══════════════════════════════════════════
(async () => {
  // Verify Leaflet loaded
  if (typeof L === 'undefined') {
    document.getElementById('status').textContent = 'Error: Map library failed to load';
    document.getElementById('status').className = 'status error';
    return;
  }

  await dbOpen();
  await refreshCacheSize();

  // Auto-detect location
  locateUser();

  // Register Service Worker
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js');
      console.log('Service Worker registered');
    } catch (e) {
      console.log('SW registration failed:', e);
    }
  }
})();
</script>
